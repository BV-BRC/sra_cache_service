#
# SRACache deployment configuration.
#
# This is the module's checked-in copy (matching the Workspace/
# homology_service convention: this file documents the shape and ships safe
# defaults; the real deployed deployment.cfg is generated/edited separately
# and is what production actually reads).
#
# Phase 1 needs only listen/data-listen/log-level to load and pick listen
# addresses. Phase 6 (this commit) adds the catalog/cache/fetcher/AIMD keys
# below. Later phases add the rest to this same [SRACache] section as
# they're built -- see PLAN-sra-cache-service-implementation.md:
#
#   Phase 7:  data-plane-base-url, download-lifetime, download-secret
#   Phase 10: ncbi-api-key
#
# download-secret and ncbi-api-key are bearer secrets: this checked-in copy
# must never carry real values for them (ship them empty/absent here; real
# values go only into the deployed deployment.cfg). The service must refuse
# to start with an empty download-secret once Phase 7/10 wire that up.
#
[SRACache]
listen = :7141
data-listen = :7142
log-level = info

# --- Phase 6: catalog, on-disk cache, fetcher, AIMD limiter ---
#
# cache-root and catalog-db must live on local SSD, never the shared NetApp
# (PLAN-sra-precache-service.md section 2.1 explains why: prefetch/
# fasterq-dump do non-sequential I/O the NetApp's spinning disks handle
# poorly). The values below are safe, self-contained defaults for local
# dev/testing only (internal/config.Load applies the same defaults if these
# keys are absent entirely, so a minimal [SRACache] section still boots) --
# a real deployment.cfg MUST override both to real local-SSD paths.
cache-root = /tmp/sra-cache/cache
catalog-db = /tmp/sra-cache/catalog.sqlite

# max-cache-size accepts a bare byte count or a humanize.ParseBytes suffix
# (e.g. 500G, 1.5TiB) -- no single suffix convention is mandated by the
# design docs, so both forms work.
max-cache-size = 100G

# prefetch-bin: where the SRA Toolkit's prefetch binary lives on this
# site's hosts (it is not on PATH by default). Confirmed v3.1.0 at this
# path; see internal/fetcher's doc comments for the CLI flags this service
# actually invokes it with.
prefetch-bin = /vol/patric3/cli/ubuntu-runtime/bin/prefetch

# AIMD prefetch concurrency limiter (PLAN-sra-precache-service.md section 4):
# starts at initial-concurrent-prefetch, ramps by +1 per clean window,
# multiplicative-backs-off on any throttle signal, and can never exceed
# max-concurrent-prefetch. Both are deliberately unvalidated starting
# guesses -- see internal/ratelimit's doc comment -- discovered at runtime,
# not pre-measured. The ceiling is never persisted across restarts; the
# service always re-ramps from initial-concurrent-prefetch.
initial-concurrent-prefetch = 2
max-concurrent-prefetch = 16
