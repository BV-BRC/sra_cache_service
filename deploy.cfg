#
# SRACache deployment configuration.
#
# This is the module's checked-in copy (matching the Workspace/
# homology_service convention: this file documents the shape and ships safe
# defaults; the real deployed deployment.cfg is generated/edited separately
# and is what production actually reads).
#
# Phase 1 only needs the three keys below to load and to pick listen
# addresses. Later phases add the following keys to this same [SRACache]
# section as they're built -- see PLAN-sra-cache-service-implementation.md:
#
#   Phase 5:  cache-root, staging-dir, catalog-db, max-cache-size
#   Phase 6:  prefetch-bin, initial-concurrent-prefetch, max-concurrent-prefetch
#   Phase 7:  data-plane-base-url, download-lifetime, download-secret
#   Phase 10: ncbi-api-key
#
# download-secret and ncbi-api-key are bearer secrets: this checked-in copy
# must never carry real values for them (ship them empty/absent here; real
# values go only into the deployed deployment.cfg). The service must refuse
# to start with an empty download-secret once Phase 7/10 wire that up.
#
[SRACache]
listen = :7141
data-listen = :7142
log-level = info
